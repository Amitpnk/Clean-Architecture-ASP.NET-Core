version: 2.1

orbs:
  sonarcloud: sonarsource/sonarcloud@1.0.1

jobs:
  build:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - checkout
      - run:
          name: Restore
          command: dotnet restore CleanArch.sln
      - run:
          name: Build
          command: dotnet build CleanArch.sln --no-restore --configuration Release
      - run:
          name: Test
          command: dotnet test CleanArch.sln --no-build --configuration Release

workflows:
  main:
    jobs:
      - build:
          context: SonarCloud
